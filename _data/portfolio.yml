# image:   path to the display file (long edge ~1600px is plenty)
# full:    optional larger file for the lightbox; defaults to `image`
# title:   what it is, in a few words
# meta:    where and when
# alt:     description for screen readers — write this one honestly
# home:    true puts it in the six-frame selection on the home page

