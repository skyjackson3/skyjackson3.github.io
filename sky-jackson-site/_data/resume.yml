summary: >-
  Communications professional who builds the systems the work runs on: intake
  and approval workflows, documented procedures, editorial calendars, and
  accessibility standards. Currently the de facto project lead for the
  communications office of a 400-person cabinet-level state department,
  managing a biweekly bilingual newsletter to roughly 50,000 subscribers, an
  agency-wide request queue, and the full operations documentation set built to
  carry the office through a change in administration.

work:
  - role: Communications Coordinator and Photographer
    org: New Mexico Early Childhood Education and Care Department
    where: Santa Fe, New Mexico
    when: "May 2023 — present"
    bullets:
      - "Serve as de facto project lead for a five-person communications office through an extended director vacancy, coordinating deliverables across every division of the department, external partners, and executive review."
      - "Rebuilt the office's request intake in Smartsheet — a 30-column tracker with automated routing, tiered approvals, and a metrics dashboard — replacing a legacy proprietary system and consolidating every division's requests into one managed queue."
      - "Led that intake's migration to Freshservice as the department consolidated onto a single service platform, delivering IT a complete handoff package of eight service catalog items with request workflows, routing logic, and accessibility intake fields."
      - "Designed and documented end-to-end production for the ECECD Briefing, the department's biweekly bilingual newsletter to roughly 50,000 subscribers, codified in a 17-page standard operating procedure covering deadlines, editorial standards, translation, review, and send."
      - "Authored the department's three-part communications documentation set — Style Guide Quick Reference, Communications Handbook, and Communications Procedures — establishing house style, a declared WCAG 2.1 AA accessibility standard, and role-based routing for every request type."
      - "Produced a 38-page operational transition guide and five role-specific worksheets to preserve institutional knowledge through the January 2027 change in administration."
      - "Established the department's accessibility practice: contrast-compliance matrices for the full brand palette, screen reader verification across VoiceOver, TalkBack, and NVDA, and a phased staff rollout plan."
      - "Rebuilt the agency newsroom's information architecture and produced full HTML design directions; build and maintain program pages in WordPress and Divi, including new pilot program launches."
      - "Serve as the department's staff photographer, covering agency events, programs, and leadership, and managing the resulting asset library."

